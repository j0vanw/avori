<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="/assets/fonts/font.css">
    <title>Avori Shop</title>
</head>
<body>
    <header>
        <div class="top">
            <div class="front">
                <p>Avori &trade;</p>
            </div>
            <div class="center">
                <ui>
                    <li><a href="/home.html">Home</a></li>
                    <li ><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li class="active"><a href="shop.html">Shop</a></li>
                </ui>
            </div>
            <div class="end">
                <div id="guest">
                    <li><a href="auth/login.html">Login</a></li>
                    <li><a href="auth/signup.html">Signup</a></li>
                </div>
                <div id="user" style="display: none;">
                    <span id="userInfo">test</span>
                    <button id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </header>
<div class="cart-hamburg">
    <div class="cart-btn">
        <li><button onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</button></li>
        <li><button class="hamburg-btn" onclick="toggleHamburg()">&#9776;</button></li>
    </div>
</div>
<main>
    <section class="products-grid">
        <div class="product-card" data-id="1" data-name="Black Shirt" data-price="100">
            <img src="/assets/imgs/black-shirt.png" alt="Black Shirt">
            <h3>Black Shirt</h3>
            <p>$100</p>
            <button class="addCart" onclick="addToCart(1)">Cart</button>
        </div>
        <div class="product-card" data-id="2" data-name="Black Cap" data-price="200">
            <img src="/assets/imgs/black-cap.png" alt="Black Cap">
            <h3>Black Cap</h3>
            <p>$200</p>
            <button class="addCart" onclick="addToCart(2)">Cart</button>
        </div>
    </section>
</main>
<div class="hamburg-menu" id="hamburg-menu">
    <div class="hamburg-header">
        <h2>Menu</h2>
        <button class="hamburg-close" onclick="toggleHamburg()">✖</button>
    </div>
    <div class="hamburg-items">
        <li><a href="/home.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </div>
    <div class="hamburg-auth">
        <li><a href="auth/login.css">Login</a></li>
        <li><a href="auth/signup.html">Signup</a></li>
    </div>
</div>
<div class="cart" id="cart">
    <div class="cart-header">
        <h2>Your Cart</h2>
        <button class="cart-close" onclick="toggleCart()">✖</button>
    </div>
    <div id="cart-items"></div>
    <div class="cart-total">Total: $<span id="cart-total">0</span></div>
    <div class="checkout-btn">
        <button onclick="checkoutStripe()">Pay with Stripe</button>
        <button onclick="checkoutPayNow()">Pay with PayNow</button>
    </div>
</div>
<footer>
    <p>&copy; 2026 Avori &trade;. All rights reserved.</p>
</footer>
<script>
    const cart =[]
    const products = {
        1: {id: 1, name:"Black Tee", price:"100"},
        2: {id: 2, name:"Black Cap", price:"200"},
    };

    function addToCart(id) {
        const existing =cart.find(item => item.id === id);
        if (existing) {
            existing.qty++;
        } else {
            cart.push({ ...products[id], qty: 1});
        }
        updateCart();
    }
    function updateCart() {;
        const cartItems = document.getElementById("cart-items")
        const cartTotal = document.getElementById("cart-total")
        const cartCount = document.getElementById("cart-count")
        cartItems.innerHTML = "";
        let total = 0;
        let count = 0;
        cart.forEach(item => {
            total += item.price * item.qty;
            count += item.qty;
            const div = document.createElement("div")
            div.className = "cart-item";
            const text = document.createElement("span");
            text.innerText = `${item.name} x ${item.qty} - $${item.price * item.qty}`;
            const deleteBtn = document.createElement("button");
            deleteBtn.innerText = "🗑️";
            deleteBtn.className = "delete-btn";
            deleteBtn.onclick = () => {
                item.qty--;
                if (item.qty <= 0) {
                    const index = cart.findIndex(cartItem => cartItem.id === item.id);
                    cart.splice(index, 1);
                }
                updateCart();
            };
            div.appendChild(text)
            div.appendChild(deleteBtn)
            cartItems.appendChild(div);
        });
        cartTotal.innerText = total.toFixed(2);
        cartCount.innerText = count;
    }

    function toggleCart() {
        const cartEl = document.getElementById("cart")
        cartEl.classList.toggle("cart-open");
        console.log("Cart Toggled", cartEl.classList);
    }
    document.addEventListener("click", function (e) {
        const cart = document.getElementById("cart")
        const cartButton = document.getElementById("cart-btn button");

        if (
            cart.classList.contains("cart-open") &&
            !cart.contains(e.target) &&
            !cartButton.contains(e.target)
        ) {
            cart.classList.remove("cart-open");
        }
    });

    function toggleHamburg() {
        const hamburgEl = document.getElementById("hamburg-menu")
        hamburgEl.classList.toggle("hamburg-open")
        console.log("Hamburger menu toggled", hamburgEl.classList)
    }
    document.addEventListener("click", function (e) {
        const hamburgMenu = document.getElementById("hamburg-menu")
        const hamburgButton = document.querySelector(".hamburg-btn button")

        if (
            hamburgMenu.classList.contains("hamburg-open") &&
            !hamburgMenu.contains(e.target) &&
            !hamburgButton.contains(e.target)
        ) {
            hamburgMenu.classList.remove("hamburg-open")
        }
    });
</script>
</html>
